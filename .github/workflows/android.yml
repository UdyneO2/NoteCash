name: Build APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Bangun APK + AAB rilis bertanda tangan"
        type: boolean
        default: false

jobs:
  debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && !inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NoteCash-debug
          path: app/build/outputs/apk/debug/*.apk

  # Berjalan saat tag v* didorong (mis. v1.4) atau saat workflow dijalankan manual dengan "release".
  # Secrets yang dibutuhkan: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
  # Membuat keystore:  keytool -genkeypair -v -keystore notecash.jks -alias notecash -keyalg RSA -keysize 2048 -validity 10000
  # Mengisi KEYSTORE_BASE64:  base64 -w0 notecash.jks
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diisi. Build rilis dibatalkan agar tidak memakai kunci debug."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/notecash.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/notecash.jks" >> "$GITHUB_ENV"
      - name: Build APK dan AAB rilis
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NoteCash-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Publikasikan ke GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
